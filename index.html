<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Google Fonts: Pacifico and Quicksand -->
    <link rel="icon" type="image/png" href="db0f9b11c1025ccb5d9f2975d039e690.jpg">
    <meta charset="utf-8" />
    <title>My Snowglobe</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="hero">
      <h1>My Snowglobe</h1>
      <p class="tagline">Shake it for a little winter kindness</p>
    </header>
    <main>
      <section class="globe-card">
        <div class="globe" id="globe">
          <img class="scene" src="snowglobe.png" alt="a snowglobe" />
        </div>
         <button id="shake">Shake the globe</button>
        <p class="message" id="message">Press the button and see what settles</p>
      </section>
    </main>
    <footer>
      <p>Made by me, in the Moroccan hot sun</p>
    </footer>
    <script src="script.js"></script>
    </body>
</html>
